name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  smoke:
    # The plugin claims linux, macos, and windows. Prove all three.
    # On the Windows runner `shell: bash` is Git Bash, which is the same
    # interpreter Herdr uses there for `sh open.sh` and `sh launch.sh`.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Show the interpreter and Python
        shell: bash
        run: |
          uname -a
          sh --version 2>/dev/null | head -1 || true
          command -v python3 python py || true
      - name: Smoke test
        shell: bash
        run: sh tests/smoke.sh
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Headless Codex job tests
        run: python tests/codex_jobs.py
      - name: Lantern session cleanup tests
        run: python tests/session_cleanup.py
      - name: Team transport tests
        run: python tests/teams.py
      - name: Desktop protocol tests
        run: python tests/desktop.py
  oldest-python:
    # Apple's own python3 is 3.9. Lantern keeps running on it, and the Codex
    # and Fugu rows say they need Python 3.11 there.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      - name: Python suites on 3.9
        run: |
          for suite in models gemini_models codex_jobs field_status plan_usage session_cleanup teams desktop; do
            python "tests/$suite.py" || exit 1
          done
